<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https:; frame-ancestors 'none'; upgrade-insecure-requests"
    />
    <title>Cloud2BR Open Source Microsoft Cloud Sandbox - Learning Hub</title>
    <link rel="icon" type="image/png" href="./assets/org-logo.png" />
    <link rel="shortcut icon" type="image/png" href="./assets/org-logo.png" />
    <link rel="apple-touch-icon" href="./assets/org-logo.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('orgCatalogTheme') === 'dark')
            document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="headerGrid" aria-label="Header layout">
          <div class="headerRail" aria-label="Organization logo">
            <img
              class="avatar orgAvatar"
              src="https://github.com/Cloud2BR-MSFTLearningHub.png?size=256"
              alt="Cloud2BR avatar"
              width="120"
              height="120"
              loading="lazy"
            />
          </div>

          <div class="headerMain">
            <div class="titleRow">
              <h1 class="title">
                <span data-i18n="org.title.main">Cloud2BR Open Source</span><br />
                <span data-i18n="org.title.sub">Microsoft Cloud Sandbox - Learning Hub</span>
              </h1>
              <button id="advancedSearchToggle" class="button advancedSearchToggle" type="button" aria-expanded="false" aria-controls="filtersPanel">
                <span aria-hidden="true">⌕</span>
                <span data-i18n="Advanced search">Advanced search</span>
              </button>
            </div>
            <p class="subtitle" data-i18n="org.description">
              Experimentation and playful learning, inviting users to try out Microsoft technology without fear of breaking things.
            </p>

            <div class="brandRow" aria-label="About">
              <div class="brandMeta">
                <span class="pipelineBadges" aria-label="Pipeline status">
                  <span data-i18n="label.pipeline">Pipeline</span>:
                  <a
                    class="badgeLink"
                    href="https://github.com/Cloud2BR-MSFTLearningHub/org-catalog/actions/workflows/pages-prod.yml"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="GitHub Pages deploy (prod) workflow"
                  >
                    <img
                      class="badgeImg"
                      src="https://github.com/Cloud2BR-MSFTLearningHub/org-catalog/actions/workflows/pages-prod.yml/badge.svg?branch=main"
                      alt="Deploy GitHub Pages (prod) status"
                      loading="lazy"
                    />
                  </a>
                </span>
              </div>
            </div>

            <div class="controls">
              <div class="controlsLeft">
                <label class="searchLabel" for="q" data-i18n="label.search">Search</label>
                <input
                  id="q"
                  class="search"
                  placeholder="name, description, topics, language"
                  data-i18n-placeholder="placeholder.search"
                  autocomplete="off"
                />
              </div>

              <div class="controlsRight" aria-label="View controls">
                <label class="searchLabel" for="lang" data-i18n="label.languageUi">Translate</label>
                <select id="lang" class="select selectSmall" aria-label="Language">
                  <option value="auto" selected data-i18n="lang.auto">Auto</option>
                  <option value="en" data-i18n="lang.en">English</option>
                  <option value="es" data-i18n="lang.es">Español</option>
                  <option value="pt" data-i18n="lang.pt">Português</option>
                  <option value="fr" data-i18n="lang.fr">Français</option>
                  <option value="zh" data-i18n="lang.zh">中文</option>
                  <option value="ja" data-i18n="lang.ja">日本語</option>
                  <option value="ko" data-i18n="lang.ko">한국어</option>
                </select>

                <div class="segmented" role="group" aria-label="Catalog view">
                  <button id="viewPublic" class="segButton active" type="button" data-i18n="button.public">Public</button>
                  <button id="viewPrivate" class="segButton" type="button" data-i18n="button.private">Private</button>
                </div>

                <button id="themeToggle" class="button themeToggleBtn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
              </div>
            </div>
          </div>

        </div>

      </div>
    </header>

    <main class="container">
      <section id="filtersPanel" class="filtersSection" aria-label="Filters" hidden>
        <div class="sideCard filtersCard">
          <div class="sideLabel" data-i18n="label.filters">Filters</div>
          <div class="filtersRow">
            <div class="filterGroup">
              <label class="filterLabel" for="languageFilter" data-i18n="label.language">Language</label>
              <select id="languageFilter" class="select">
                <option value="all">All</option>
              </select>
            </div>

            <div class="filterGroup">
              <label class="filterLabel" for="categoryFilter" data-i18n="label.category">Category</label>
              <select id="categoryFilter" class="select">
                <option value="all">All</option>
              </select>
            </div>

            <div class="filterGroup">
              <label class="filterLabel" for="updatedWithin" data-i18n="label.updated">Updated</label>
              <select id="updatedWithin" class="select selectSmall">
                <option value="any">Any time</option>
                <option value="7">Last 7 days</option>
                <option value="30">Last 30 days</option>
                <option value="90">Last 90 days</option>
                <option value="365">Last 365 days</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="grid" class="grid" aria-label="Repository list"></div>
    </main>

    <footer class="footer">
      <div class="container">
        <span id="footerMeta" class="footerMeta"></span>
      </div>
    </footer>

    <script type="module" src="./app.js?v=20260303"></script>
  </body>
</html>
