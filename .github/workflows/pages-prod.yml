name: Deploy GitHub Pages (with translations)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  deployments: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  translate:
    name: Translate catalog (required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preflight GitHub Models access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'openai/gpt-4.1-mini' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = "https://models.github.ai/inference/chat/completions"
          model = os.environ.get("TRANSLATE_MODEL", "openai/gpt-4.1-mini")
          token = os.environ.get("GITHUB_TOKEN", "")

          if not token:
            raise SystemExit("GITHUB_TOKEN is missing. Ensure Actions has access to repository secrets.")

          payload = {
            "model": model,
            "messages": [
              {"role": "system", "content": "Reply with OK."},
              {"role": "user", "content": "OK"},
            ],
            "max_tokens": 5,
            "temperature": 0,
          }

          def check(token_value):
            if not token_value:
              return 0
            req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                "Authorization": f"Bearer {token_value}",
                "Content-Type": "application/json",
                "Accept": "application/json",
              },
              method="POST",
            )
            try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                return resp.getcode()
            except urllib.error.HTTPError as e:
              return e.code
            except Exception:
              return 599

          status = check(token)
          if status != 200:
            raise SystemExit(
              "GitHub Models preflight failed (HTTP %s). "
              "Enable GitHub Models for the org/repo and allow Actions to access Models via GITHUB_TOKEN."
              % status
            )

          print("OK")
          PY

      - name: Generate docs/catalog.json
        env:
          ORG_NAME: Cloud2BR-MSFTLearningHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'openai/gpt-4.1-mini' }}
          TRANSLATE_TO: ${{ vars.TRANSLATE_TO || 'es,pt,fr,zh,ja,ko' }}
          REQUIRE_TRANSLATIONS: 'true'
        run: node scripts/fetch-catalog.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    needs: translate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Clean up old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'pages-prod.yml',
              per_page: 100,
            });
            const successfulRuns = runs
              .filter((run) => run.conclusion === 'success' && run.status === 'completed')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const runsToDelete = successfulRuns.slice(2);
            core.info(`Found ${successfulRuns.length} successful runs. Keeping 2, deleting ${runsToDelete.length}.`);
            for (const run of runsToDelete) {
              core.info(`Deleting run ${run.id} created at ${run.created_at}.`);
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
            }

      - name: Keep only latest Pages deployment record
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              environment: 'github-pages',
              per_page: 100,
            });
            const sorted = deployments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latest = sorted[0];
            const toDelete = sorted.slice(1);
            core.info(`Found ${sorted.length} deployments. Keeping ${latest ? latest.id : 'none'}, deleting ${toDelete.length}.`);
            for (const d of toDelete) {
              core.info(`Marking deployment ${d.id} inactive.`);
              await github.rest.repos.createDeploymentStatus({
                owner, repo, deployment_id: d.id,
                state: 'inactive', auto_inactive: false,
                description: 'Removed old Pages deployment record',
              });
              core.info(`Deleting deployment ${d.id}.`);
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id });
            }
