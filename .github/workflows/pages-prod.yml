name: Deploy GitHub Pages (with translations)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  actions: write
  contents: write
  deployments: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  translate:
    name: Translate catalog (required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Models token
        env:
          TRAFFIC_TOKEN_ADMIN: ${{ secrets.TRAFFIC_TOKEN_ADMIN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          MODELS_TOKEN_SECRET: ${{ secrets.MODELS_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail

          token=""
          source=""

          if [ -n "${TRAFFIC_TOKEN_ADMIN:-}" ]; then
            token="$TRAFFIC_TOKEN_ADMIN"
            source="TRAFFIC_TOKEN_ADMIN"
          elif [ -n "${TRAFFIC_TOKEN:-}" ]; then
            token="$TRAFFIC_TOKEN"
            source="TRAFFIC_TOKEN"
          elif [ -n "${MODELS_TOKEN_SECRET:-}" ]; then
            token="$MODELS_TOKEN_SECRET"
            source="MODELS_TOKEN"
          elif [ -n "${GITHUB_TOKEN_FALLBACK:-}" ]; then
            token="$GITHUB_TOKEN_FALLBACK"
            source="github.token"
          fi

          if [ -z "$token" ]; then
            echo "No token available. Expected one of: TRAFFIC_TOKEN_ADMIN, TRAFFIC_TOKEN, MODELS_TOKEN, or github.token." >&2
            exit 1
          fi

          echo "Using Models token source: $source"
          echo "::add-mask::$token"
          echo "MODELS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "MODELS_TOKEN_SOURCE=$source" >> "$GITHUB_ENV"

      - name: Preflight GitHub Models access
        env:
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'openai/gpt-4.1-mini' }}
        run: |
          python3 - <<'PY'
          import json
          import time
          import os
          import urllib.error
          import urllib.request

          endpoint = "https://models.github.ai/inference/chat/completions"
          model = os.environ.get("TRANSLATE_MODEL", "openai/gpt-4.1-mini")
          token = os.environ.get("MODELS_TOKEN", "")

          if not token:
            raise SystemExit("MODELS_TOKEN is missing. Configure one of: TRAFFIC_TOKEN_ADMIN, TRAFFIC_TOKEN, MODELS_TOKEN, or enable GITHUB_TOKEN Models access.")

          payload = {
            "model": model,
            "messages": [
              {"role": "system", "content": "Reply with OK."},
              {"role": "user", "content": "OK"},
            ],
            "max_tokens": 5,
            "temperature": 0,
          }

          def check(token_value):
            if not token_value:
              return 0
            req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                "Authorization": f"Bearer {token_value}",
                "Content-Type": "application/json",
                "Accept": "application/json",
              },
              method="POST",
            )
            try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                return resp.getcode()
            except urllib.error.HTTPError as e:
              return e.code
            except Exception:
              return 599

          status = None
          for attempt in range(4):
            status = check(token)
            if status == 200:
              break
            if status in (429, 500, 502, 503, 504, 599):
              delay = 1.5 * (2 ** attempt)
              print(f"Transient preflight status {status}, retrying in {delay:.1f}s...")
              time.sleep(delay)
              continue
            break

          if status in (401, 403):
            raise SystemExit(
              "GitHub Models preflight failed (HTTP %s). "
              "Enable GitHub Models for the org/repo and ensure your PAT is valid/SSO-authorized (or allow Actions Models via GITHUB_TOKEN)."
              % status
            )

          if status != 200:
            print(
              "Warning: GitHub Models preflight returned transient HTTP %s. "
              "Continuing because translation step has retry/backoff."
              % status
            )

          print("OK")
          PY

      - name: Generate docs/catalog.json
        env:
          ORG_NAME: Cloud2BR-MSFTLearningHub
          GITHUB_TOKEN: ${{ github.token }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'openai/gpt-4.1-mini' }}
          TRANSLATE_MODEL_FALLBACKS: ${{ vars.TRANSLATE_MODEL_FALLBACKS || 'openai/gpt-4.1-nano,openai/gpt-4o-mini,openai/gpt-4o' }}
          TRANSLATE_MAX_RETRIES: ${{ vars.TRANSLATE_MAX_RETRIES || '0' }}
          TRANSLATE_BATCH_SIZE: ${{ vars.TRANSLATE_BATCH_SIZE || '8' }}
          TRANSLATE_REQUEST_SPACING_MS: ${{ vars.TRANSLATE_REQUEST_SPACING_MS || '1800' }}
          TRANSLATE_TO: ${{ vars.TRANSLATE_TO || 'es,pt,fr,zh,ja,ko' }}
          REQUIRE_TRANSLATIONS: 'true'
        run: node scripts/fetch-catalog.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    needs: translate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Clean up old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'pages-prod.yml',
              per_page: 100,
            });
            const successfulRuns = runs
              .filter((run) => run.conclusion === 'success' && run.status === 'completed')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const runsToDelete = successfulRuns.slice(2);
            core.info(`Found ${successfulRuns.length} successful runs. Keeping 2, deleting ${runsToDelete.length}.`);
            for (const run of runsToDelete) {
              core.info(`Deleting run ${run.id} created at ${run.created_at}.`);
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
            }

      - name: Keep only latest Pages deployment record
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              environment: 'github-pages',
              per_page: 100,
            });
            const sorted = deployments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const latest = sorted[0];
            const toDelete = sorted.slice(1);
            core.info(`Found ${sorted.length} deployments. Keeping ${latest ? latest.id : 'none'}, deleting ${toDelete.length}.`);
            for (const d of toDelete) {
              core.info(`Marking deployment ${d.id} inactive.`);
              await github.rest.repos.createDeploymentStatus({
                owner, repo, deployment_id: d.id,
                state: 'inactive', auto_inactive: false,
                description: 'Removed old Pages deployment record',
              });
              core.info(`Deleting deployment ${d.id}.`);
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id });
            }
